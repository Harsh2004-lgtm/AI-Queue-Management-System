<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
   

    <h1>Queue Admin Dashboard</h1>
     <!-- ==========================================
     TESTIMONIAL MANAGEMENT
     ========================================== -->

<section class="admin-testimonials">

    <h2>Pending Testimonials</h2>

    <div id="pendingTestimonials">
        <p>Loading testimonials...</p>
    </div>

</section>
<!-- ==========================================
     APPROVED TESTIMONIALS
     ========================================== -->

<section class="admin-testimonials">

    <h2>Approved Testimonials</h2>

    <div id="approvedTestimonialsAdmin">
        <p>Loading testimonials...</p>
    </div>

</section>

    <button id="nextCustomerBtn">
        Next Customer
    </button>

    <div id="currentCustomer"></div>
    <div id="queueStats"></div>
    
    <h2>Customer Queue</h2>

    <div id="adminQueue"></div>
    <div class="queue-page">

    <div class="queue-card">

        <h1>Join Queue</h1>

        <p>Enter your details to get your queue token.</p>

        <div class="queue-form" id="queueForm">

            <label for="customerName">Your Name</label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
            >

            <label for="service">Select Service</label>

            <select id="service">
                <option value="">Select Service</option>
                <option value="Account Opening">Account Opening</option>
                <option value="Cash Deposit">Cash Deposit</option>
                <option value="Cash Withdrawal">Cash Withdrawal</option>
                <option value="Loan">Loan</option>
            </select>

            <button id="getTokenBtn">
                Get Token 🎫
            </button>

            <div id="tokenResult"></div>

        </div>

    </div>

</div>


    <script src="script.js"></script>

</body>

</html>
